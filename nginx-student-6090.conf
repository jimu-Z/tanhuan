# ============================================
# 学生端前端 - 端口 6090
# 宝塔面板：放到 /www/server/panel/vhost/nginx/ 目录下
# 或者在宝塔面板 → 网站 → 站点设置 中手动添加
# ============================================

server {
    listen       6090;
    server_name  211.64.39.248;

    location / {
        root   /home/ruoyi/student-ui/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://211.64.39.248:6060/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }

    # 宝塔面板常用配置（按需保留）
    access_log  /www/wwwlogs/tanhuan-student.log;
    error_log  /www/wwwlogs/tanhuan-student.error.log;
}
